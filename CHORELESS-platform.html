ts a different response than a rant."],["Draft & flag","A response is written for your one-tap approval \u2014 and if three reviews mention the same broken thing, that pattern gets flagged as an operations alert, not just answered politely."],["Report","A monthly reputation report: rating trends, response times, and the complaint heatmap that tells you what to actually fix."]],lands:["Every review answered within a week, in your voice","Operations alerts when complaints cluster","Monthly reputation report with complaint heatmap"],finePrint:"Needs: your Google Business / Yelp / Facebook connections and 10 minutes of tone questions at setup."},"Social Autopilot":{scene:"The businesses that win on social aren't the cleverest \u2014 they're the ones still posting in week forty. You know this. You also know you will not be designing a carousel about your seasonal special at midnight on a Sunday. So the calendar builds itself: thirty days of posts that look like you hired someone, because in a sense you did.",steps:[["Mine what's working","Your sales data, seasonality, and past post performance decide what gets pushed \u2014 winners promoted, slow movers cleared."],["Write the month","A 30-day calendar with hooks, captions and hashtags in your voice \u2014 mixed formats, not thirty variations of the same post."],["Design every tile","Each post rendered in your locked brand kit: your colors, your type, your logo placement. No lavender-gradient AI mush."],["Schedule on approval","You review the month in one sitting, tap approve, and it schedules across Instagram and Facebook."]],lands:["30 designed, captioned, scheduled posts","A content strategy note explaining why each week pushes what it pushes","Monthly performance recap feeding the next calendar"],finePrint:"Needs: your social accounts connected and a brand kit (we build it at onboarding if you don't have one)."},"Clip Factory":{scene:"Somewhere in your 74-minute episode is the 40-second moment that would stop a million thumbs. You know it's in there. You also know finding it means scrubbing timelines until 2am. So don't: upload once, and the factory finds the peaks, cuts them, captions them, frames them vertical, and tells you which one to post first \u2014 with a number attached.",steps:[["Map the peaks","Full transcription plus an emotional map: laughter, tension, hot takes, story turns \u2014 the moments that hold attention."],["Cut for the hook","Each clip opens on its strongest three seconds. No 'so anyway, as I was saying' cold starts."],["Dress it","Animated captions in your style, vertical reframing that keeps faces centered, and a thumbnail per clip."],["Score it","Every clip gets a predicted-retention score and a recommended posting order. You post the winners, skip the rest."]],lands:["8\u201312 captioned vertical shorts per upload","A thumbnail for each","Retention scores + recommended posting order"],finePrint:"Needs: a video link or upload. Works from YouTube, Drive, or a raw file."},"Refund & Comp Recovery":{scene:"You paid $340 for the flight. It dropped to $280 the next morning, and the airline is delighted you'll never notice. The delivery came four days late \u2014 that's a refund you're owed and will never claim. The internet was down six hours \u2014 that's a bill credit sitting there unasked. This service's whole job is to notice, and to ask, so a slow trickle of your own money finds its way back without you lifting a finger.",steps:[["Watch the receipts","Purchases, flights, packages and services are monitored against prices, delivery promises and uptime \u2014 the moment one slips, it's flagged as recoverable money."],["Know the rule","Airlines owe delay comp under specific rules; retailers honor price-adjustment windows; ISPs credit outages. Each claim is filed citing the exact policy that forces a yes."],["File on your say-so","Anything account-touching comes back for one-tap approval; the claim goes to the channel that actually pays, with the paper trail retained."],["Bank it","A running ledger of what's been recovered this month \u2014 real dollars back, and credits spent only on the wins."]],lands:["Price-drop, delay, outage and wrong-charge claims filed for you","One-tap approval on anything account-touching","A monthly ledger of money actually recovered"],finePrint:"Results-priced: credits are spent only when a claim actually recovers money. Needs read access to the receipts/accounts you want watched."},"Digital Footprint Cleaner":{scene:"Type your own name into Google with a private window open. The home address. The old phone number. The relatives listed like a family tree you didn't publish. Data brokers assembled that for anyone with $2 and a grudge \u2014 and they'll rebuild it the week after you remove it, which is why this isn't a one-time scrub but a standing watch that makes you quietly, durably harder to find.",steps:[["Map your exposure","A sweep across the major data-broker networks, people-search sites and breach databases surfaces everywhere you're listed \u2014 with links."],["File the removals","Opt-out and deletion requests submitted to each, using the specific legal request each one is required to honor \u2014 not the polite form they hope you'll use."],["Close the zombies","Dormant accounts you forgot, newsletters you never read, logins tied to old breaches \u2014 closed and unsubscribed at the source."],["Keep watch","Brokers re-list you constantly. Monthly re-scans catch it and re-file, so the cleanup holds instead of quietly undoing itself."]],lands:["Removal from the major data-broker and people-search sites","Zombie accounts closed, mass-unsubscribes done","Monthly monitoring + re-removal when you get re-listed"],finePrint:"Results-priced after the initial sweep: monitoring credits spend only when a new listing is found and removed. Needs the name/aliases and details you want scrubbed."},"Hard Conversation Ghostwriter":{scene:"It's the message that's been sitting in your drafts for a week \u2014 the client you have to let go, the friend who still owes you $400, the landlord who won't fix the heat, the raise you've earned and can't figure out how to ask for. The words aren't hard because you don't know what you mean. They're hard because tone is everything and you're too close to it. Describe the situation once; get back something that says the hard thing cleanly, keeps the door open where it should be, and closes it where it must.",steps:[["Hear the whole situation","The relationship, the history, the outcome you actually want, and the lines you're afraid to cross \u2014 captured in a couple of questions."],["Find the register","Firm without cruelty, warm without weakness, final without burning the bridge \u2014 the exact register the moment needs, matched to your natural voice."],["Draft the message","The email, text, or letter \u2014 ready to send, with the one hard sentence handled instead of hedged into meaninglessness."],["Arm the follow-up","The reply for when they push back, guilt-trip, or negotiate \u2014 drafted in advance so you're never caught flat in the moment that counts."]],lands:["The message you're dreading, written and send-ready","A follow-up drafted for when they push back","The right register \u2014 firm, warm, or final \u2014 matched to your voice"],finePrint:"Needs: the situation in your words and any thread it's replying to. Nothing sends without you \u2014 the words are yours to use or edit."}},z={Starter:0,Pro:1,Business:2},_={Starter:10,Pro:30,Business:100},D={"Hard Conversation Ghostwriter":"Starter","Refund & Comp Recovery":"Starter","Clip Factory":"Pro","Digital Footprint Cleaner":"Pro","Social Autopilot":"Pro","Reputation Autopilot":"Business"},E=(e,s)=>z[s]>=z[D[e]];const P=(e,s=8)=>{const a=(e||"").trim().split(/\s+/);return a.slice(0,s).join(" ")+(a.length>s?"\u2026":"")},V={"Reputation Autopilot":{fields:[{key:"biz",label:"Your business name",type:"text",placeholder:"Bluebird Caf\xE9"},{key:"stars",label:"Star r ptions:["This week","This month","1\u20133 months ago"]}],generate:e=>{const s=e.what||"",a=s.startsWith("A price"),o=s.includes("late"),d=s.includes("outage");return[{h:"The rule that forces a yes",lines:[a?`\u2022 ${e.item||"This purchase"} likely falls inside a price-adjustment window most retailers honor but never advertise. We cite their own policy back to them and request the difference refunded to your original payment.`:o?`\u2022 ${e.item||"This trip/delivery"} \u2014 carriers owe compensation for delays past defined thresholds under specific regulations. We file citing the exact rule and delay length, not a vague complaint.`:d?`\u2022 ${e.item||"This service"} \u2014 providers credit outages on request but bank on you not asking. We calculate the pro-rated credit and demand it in writing.`:`\u2022 ${e.item||"This charge"} \u2014 a formal dispute citing the card network's rules goes to the billing channel that must respond, with your issuer ready to CC if they stall.`]},{h:"Drafted claim (files on your one tap)",lines:[`Re: ${a?"Price adjustment request":o?"Delay compensation claim":d?"Service outage credit":"Formal charge dispute"} \u2014 ${e.item||"[item]"}`,a?`"I purchased the above ${(e.when||"recently").toLowerCase()} and the price has since dropped. Per your price-adjustment policy, I request the difference refunded to my original payment method within your stated window."`:o?'"The above was delayed beyond the threshold at which compensation is owed. I am claiming the compensation due under the applicable regulation and request written confirmation and payment within the mandated period."':d?`"Service was interrupted for a material period ${(e.when||"recently").toLowerCase()}. I request a pro-rated credit for the outage applied to my next statement, per your service terms."`:`"I am formally disputing the above charge under the card network's dispute rules and applicable billing law, and request written resolution within 30 days."`]},{h:"Then it just\u2 <script>
(function () {
  var strips = document.querySelectorAll("#chl-flash p");
  for (var i = 0; i < strips.length; i++) strips[i].textContent = new Array(13).join("CHORELESS ✦ ");
  var EASE = "cubic-bezier(.22,1,.36,1)";
  var last = { x: 0, y: 0, t: -1 };
  window.addEventListener("pointerdown", function (e) {
    last = { x: e.clientX, y: e.clientY, t: performance.now() };
  }, true);
  function ring(x, y) {
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid rgba(255,77,0,.5);border-radius:50%;pointer-events:none;z-index:9999;";
    document.body.appendChild(el);
    el.animate([{ transform: "scale(.6)", opacity: 0.55 }, { transform: "scale(3.4)", opacity: 0 }], { duration: 420, easing: EASE, fill: "forwards" });
    setTimeout(function () { el.remove(); }, 460);
  }
  function play() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var root = document.getElementById("root");
    var shell = root && root.firstElementChild;
    if (!shell) return;
    var fresh = performance.now() - last.t < 600;
    var x = fresh ? last.x : window.innerWidth / 2;
    var y = fresh ? last.y : window.innerHeight / 2;
    window.scrollTo(0, 0);
    var rect = shell.getBoundingClientRect();
    var r = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) + 24;
    shell.animate(
      [{ clipPath: "circle(0px at " + (x - rect.left) + "px " + (y - rect.top) + "px)" },
       { clipPath: "circle(" + r + "px at " + (x - rect.left) + "px " + (y - rect.top) + "px)" }],
      { duration: 420, easing: EASE });
    ring(x, y);
  }
  function watch() {
    var root = document.getElementById("root");
    var shell = root && root.firstElementChild;
    if (!shell) { requestAnimationFrame(watch); return; }
    new MutationObserver(function (muts) {
      var added = false, removed = false;
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].addedNodes.length) added = true;
        if (muts[i].removedNodes.length) removed = true;
      }
      if (added && removed) play();
    }).observe(shell, { childList: true });
  }
  watch();
})();
</script>
