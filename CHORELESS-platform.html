r research is dead.",credits:2,turnaround:"Runs weekly",autopilot:!0,keywords:["competitor","rival","market","pricing","spy","watch"]},{name:"Clip Factory",lane:"Creator",tagline:"One video in. Ten shorts out.",deliverable:"Your long-form video cut into captioned, hook-optimized shorts with thumbnails — each scored for predicted retention before delivery.",whyNow:"Short-form is where audiences grow; editing is where creators burn out.",credits:5,turnaround:"24h",keywords:["video","clip","shorts","podcast","edit","youtube","reels","cut"]},{name:"Repurpose Engine",lane:"Creator",tagline:"Make everything from anything.",deliverable:"One piece of content becomes a newsletter, an X thread, a LinkedIn post and a blog article — all in your trained voice profile.",whyNow:"Multi-platform presence is table stakes; writing it all isn't.",credits:3,turnaround:"24h",keywords:["repurpose","newsletter","thread","blog","linkedin","article"]},{name:"Brand Kit Lab",lane:"Creator",tagline:"Your look, on demand.",deliverable:"Thumbnails, banners, and post templates generated to match your locked visual identity — unlimited revisions until it's right.",whyNow:"CTR lives and dies on the thumbnail. Designers cost $50+ each.",credits:2,turnaround:"12h",keywords:["thumbnail","banner","design","logo","brand","template","graphic"]},{name:"Sponsor Kit",lane:"Creator",tagline:"Always ready to pitch.",deliverable:"A media kit that updates itself with your live stats, plus researched sponsor matches and personalized outreach drafts each month.",whyNow:"Brand deals are the top creator revenue line — and the least systematized.",credits:4,turnaround:"Runs monthly",autopilot:!0,keywords:["sponsor","media kit","brand deal","pitch","outreach"]},{name:"Inbox Concierge",lane:"Life",tagline:"Wake up to three emails, not three hundred.",deliverable:"Daily triage of your inbox: replies drafted and waiting, junk unsubscribed, and a morning digest of the 3 things that actually need you.",whyNow:"The average professional loses 2.5 hours a day to email.",credits:3,turnaround:"Runs daily",autopilot:!0,keywords:["email","inbox","unsubscribe","triage","reply","gmail"]},{name:"Paperwork Agent",lane:"Life",tagline:"Forms filed. Disputes disputed.",deliverable:"Subscription cancellations, billing disputes, insurance claims, government forms — drafted, filed through the right channel, and tracked to resolution.",whyNow:"Companies weaponize friction. We automate it away.",credits:2,turnaround:"24h",keywords:["cancel","dispute","claim","form","refund","insurance","subscription","charge"]},{name:"Career Engine",lane:"Life",tagline:"Every application, tailored.",deliverable:"Paste a job posting: get a tailored resume, cover letter and interview prep brief, plus a tracker across every application.",whyNow:"AI screening means generic resumes die on arrival.",credits:2,turnaround:"12h",keywords:["resume","job","cover letter","interview","career","application","cv"]},{name:"Life Logistics",lane:"Life",tagline:"The personal assistant tier of life.",deliverable:"Booking-ready travel itineraries, appointment wrangling, gift planning, and price-drop monitoring with automatic refund claims.",whyNow:"Admin is the tax on modern life. Stop paying it in hours.",credits:3,turnaround:"24h",keywords:["travel","trip","itinerary","appointment","gift","book","plan","flight","hotel"]}],d=["ad","ads","advertis","campaign","promote","marketing","meta ads","google ads","grow sales","leads"],f={"Reputation Autopilot":{scene:"It's 11:47 on a Tuesday night and someone just left you a one-star review over a parking situation you don't control. You're asleep. Good — stay asleep. By the time you're pouring coffee, a response is drafted in your voice: gracious, specific, and quietly persuasive to the 4,000 strangers who'll read it before deciding whether to walk through your door.",steps:[["Listen","Every review on Google, Yelp and Facebook is picked up within the hour — star rating, text, and the reviewer's history."],["Read the room","The pipeline studies your past replies, your tone rules, and the reviewer's actual complaint. A missed reservation gets a different response than a rant."],["Draft & flag","A response is written for your one-tap approval — and if three reviews mention the same broken thing, that pattern gets flagged as an operations alert, not just answered politely."],["Report","A monthly reputation report: rating trends, response times, and the complaint heatmap that tells you what to actually fix."]],lands:["Every review answered within a week, in your voice","Operations alerts when complaints cluster","Monthly reputation report with complaint heatmap"],finePrint:"Needs: your Google Business / Yelp / Facebook connections and 10 minutes of tone questions at setup."},"Invoice Chaser":{scene:"You did the work in March. It's July. The awkward part of chasing money isn't writing the email — it's calibrating it: firm enough to get paid, warm enough to get hired again. That calibration is exactly what a pipeline that has read your entire history with this client does better than your 11pm resentment does.",steps:[["Rank the ledger","Overdue invoices sorted by age, amount, and relationship value — the client worth keeping gets a different ladder than the serial late-payer."],["Match the tone","Each sequence is written from your email history with that client: first a nudge, then a reminder, then firm — never rude, never groveling."],["Send with teeth","Every email carries a one-click payment link. Escalations schedule themselves until the invoice closes."],["Count the cash","Month-end report: what was recovered, what's still aging, and who should be on prepayment terms next time."]],lands:["Tone-matched chase sequences, sent from your address","Payment links in every message","Cash-recovered report with prepayment recommendations"],finePrint:"Needs: QuickBooks / Stripe / a spreadsheet of invoices — whatever you've got, it adapts."},"Social Autopilot":{scene:"The businesses that win on social aren't the cleverest — they're the ones still posting in week forty. You know this. You also know you will not be designing a carousel about your seasonal special at midnight on a Sunday. So the calendar builds itself: thirty days of posts that look like you hired someone, because in a sense you did.",steps:[["Mine what's working","Your sales data, seasonality, and past post performance decide what gets pushed — winners promoted, slow movers cleared."],["Write the month","A 30-day calendar with hooks, captions and hashtags in your voice — mixed formats, not thirty variations of the same post."],["Design every tile","Each post rendered in your locked brand kit: your colors, your type, your logo placement. No lavender-gradient AI mush."],["Schedule on approval","You review the month in one sitting, tap approve, and it schedules across Instagram and Facebook."]],lands:["30 designed, captioned, scheduled posts","A content strategy note explaining why each week pushes what it pushes","Monthly performance recap feeding the next calendar"],finePrint:"Needs: your social accounts connected and a brand kit (we build it at onboarding if you don't have one)."},"Competitor Radar":{scene:"Your competitor dropped their prices on Thursday. You found out three weeks later from a customer who'd already left. Never again: now a quiet watcher reads their website, their socials, their reviews and their ad library every week — and every Monday you get one page that ends with a single recommended move.",steps:[["Watch everything","Competitor websites, menus, pricing pages, social feeds, review streams and public ad libraries — diffed weekly against last week."],["Separate signal from noise","A new logo is noise. A new offer, a price drop, a hiring spree, a wave of bad reviews — that's signal, and it gets ranked."],["Read their reviews too","Their unhappy customers are your clearest map of what to do differently — mined and summarized."],["One counter-move","Every brief ends with a single recommendation: match, ignore, or exploit. No 40-page decks."]],lands:["A one-page Monday brief on up to 5 competitors","Ranked changes with evidence links","One recommended counter-move per week"],finePrint:"Needs: a list of competitors — or we'll identify them from your market at setup."},"Clip Factory":{scene:"Somewhere in your 74-minute episode is the 40-second moment that would stop a million thumbs. You know it's in there. You also know finding it means scrubbing timelines until 2am. So don't: upload once, and the factory finds the peaks, cuts them, captions them, frames them vertical, and tells you which one to post first — with a number attached.",steps:[["Map the peaks","Full transcription plus an emotional map: laughter, tension, hot takes, story turns — the moments that hold attention."],["Cut for the hook","Each clip opens on its strongest three seconds. No 'so anyway, as I was saying' cold starts."],["Dress it","Animated captions in your style, vertical reframing that keeps faces centered, and a thumbnail per clip."],["Score it","Every clip gets a predicted-retention score and a recommended posting order. You post the winners, skip the rest."]],lands:["8–12 captioned vertical shorts per upload","A thumbnail for each","Retention scores + recommended posting order"],finePrint:"Needs: a video link or upload. Works from YouTube, Drive, or a raw file."},"Repurpose Engine":{scene:"You said something brilliant on camera and it will die there unless it becomes a newsletter, a thread, a LinkedIn post and a blog entry — four rewrites you will absolutely not do. The engine doesn't copy-paste your transcript with different line breaks. It rewrites the idea natively for each platform, in a voice profile trained on the way you actually write.",steps:[["Extract the ideas","The argument, the stories, the one-liners — pulled from the source and ranked by strength."],["Rewrite natively","A thread is built around a hook-and-payoff. A newsletter is built around intimacy. A blog post around search. Same idea, four different crafts."],["Pass the voice gate","Every piece is QA'd against your trained voice profile — vocabulary, rhythm, opinions. If it doesn't sound like you, it doesn't ship."],["Package for posting","Formatted for each platform, with suggested timing. One approval, four channels fed."]],lands:["Newsletter issue, X thread, LinkedIn post, blog article","Each in your trained voice","Suggested publish timing per platform"],finePrint:"Needs: one source piece (video, podcast, or long post) and your voice profile from onboarding."},"Brand Kit Lab":{scene:"Your last thumbnail took three hours and still looked like a ransom note. Meanwhile the channel you're losing to ships a perfect one every day, because they pay a designer $60 a pop. The Lab locks your visual identity once — colors, type, face treatment, the works — and then produces on demand, unlimited revisions, until it's exactly right.",steps:[["Lock the identity","One session captures your palette, type, logo rules and reference images into a locked identity file every job obeys."],["Generate wide","Each request produces multiple directions — not one take-it-or-leave-it comp."],["Test before you see it","Contrast, legibility-at-thumbnail-size, and CTR heuristics filter the weak options before they reach you."],["Revise until right","Unlimited revisions inside the task. 'Make my face bigger and the text angrier' is a valid instruction."]],lands:["Thumbnails, banners, and post templates on demand","All obeying your locked identity file","Source files included — you own everything"],finePrint:"Needs: your existing logo/brand assets, or 20 minutes to build the identity file from scratch."},"Sponsor Kit":{scene:"A brand emailed asking for your media kit and you sent a PDF with numbers from last spring. That silence you heard afterward was money leaving. Now the kit rebuilds itself monthly from your live stats, and alongside it comes a list of brands actively sponsoring creators your size — each with an outreach draft that mentions their last campaign, not 'Dear Partnerships Team.'",steps:[["Pull live numbers","Subscribers, views, engagement, audience demographics — pulled fresh, never stale."],["Rebuild the kit","A designed media kit in your brand identity, versioned monthly, always send-ready."],["Hunt the matches","Brands currently spending on creators in your niche and size band — found via their actual campaign activity."],["Draft the pitch","Personalized outreach referencing the brand's recent campaigns, with your rates positioned confidently."]],lands:["A self-updating media kit","Monthly list of matched, actively-spending sponsors","Personalized outreach drafts ready to send"],finePrint:"Needs: your channel/social accounts connected. Rates optional — we'll suggest a range from comparable creators."},"Inbox Concierge":{scene:"There are 300 unread emails and three of them matter. The tragedy of email isn't volume — it's that the three are buried in the 297. Every morning at 6:45, the 297 are already handled: replies drafted, junk unsubscribed, receipts filed. What you open is a digest that says: these three things need you. That's the whole inbox.",steps:[["Overnight triage","Every message classified: needs-you, needs-a-reply-we-can-draft, informational, junk."],["Draft in your voice","Replies written from your sent-mail history — your sign-offs, your bluntness level, your exclamation-point policy."],["Prune ruthlessly","Junk unsubscribed at the source, not filtered. Your inbox shrinks structurally, week over week."],["The 6:45 digest","Three things that need you, five drafts awaiting one-tap send, and nothing else."]],lands:["A daily morning digest of what actually needs you","Replies drafted and waiting for one tap","A structurally shrinking inbox"],finePrint:"Needs: Gmail or Outlook connected with scoped, revocable permissions. Drafts never send without you."},"Paperwork Agent":{scene:"The gym requires cancellation by certified letter. The airline's refund form rejects your browser. The insurer wants Form 4B, which references Form 2A, which doesn't exist. This friction is not an accident — it's a business model. The agent's entire job is to be more stubborn than their process, on your behalf, without you feeling any of it.",steps:[["Find the real channel","Every company has one channel that actually works — a specific form, address, or magic phrase. The agent knows or finds it."],["Draft with the right words","Disputes cite the card network rule. Cancellations cite the contract clause. Claims cite the policy language. Words that make processors comply."],["File and prove it","Submitted through the proper channel with timestamps and copies retained — a paper trail built like it might be needed."],["Chase to resolution","No response in their stated window? It escalates automatically. The task closes when the matter closes, not when the form is sent."]],lands:["Filed cancellations, disputes, claims and forms","A tracked case with full paper trail","Escalations until actual resolution"],finePrint:"Needs: the details of the situation and any documents. Anything requiring your signature comes back for one tap."},"Career Engine":{scene:"Your resume is being read by software before any human sees it, and the software is looking for twelve specific words. Sending the same PDF to forty jobs is how good people vanish into applicant tracking systems. Paste a posting instead: twenty minutes later there's a resume rebuilt around this job, a cover letter that mentions something true about this company, and a brief on what they'll ask you.",steps:[["Decode the posting","The role's real keywords and priorities extracted — including the unwritten ones implied by the team and seniority."],["Rebuild, never fabricate","Your actual experience reframed and reordered for this role. Truthful always — it's your history, weaponized, not invented."],["Write the letter that gets read","Three tight paragraphs referencing the company's actual work. No 'I am writing to express my interest.'"],["Prep the interview","Likely questions from the role and your gaps, with suggested answers drawn from your real stories."]],lands:["A tailored resume per posting (ATS-tested formatting)","A specific, human cover letter","Interview brief + a tracker across all applications"],finePrint:"Needs: your current resume once at setup. Then just paste postings."},"Life Logistics":{scene:"The trip is booked, which means the work has just begun: the confirmation emails, the seat that changed, the hotel that quietly dropped its rate $60 after you paid. Life admin is a thousand paper cuts that nobody gets credit for handling. Consider it handled — itineraries built to your taste, appointments wrangled, refunds claimed while you live your actual life.",steps:[["Learn your taste","Aisle or window, mornings protected, kids' nap schedule, the airline you're loyal to — preferences remembered forever."],["Build booking-ready plans","Itineraries with real availability, prices, and a plan B for the leg most likely to go wrong."],["Wrangle the calendar","Appointment scheduling ping-pong handled by email on your behalf — you get the confirmed slot, not the thread."],["Watch the money","Prices monitored after booking; drops trigger refund claims automatically. Found money, zero effort."]],lands:["Booking-ready itineraries with backup plans","Appointments confirmed without the email ping-pong","Automatic price-drop refund claims"],finePrint:"Needs: calendar and email access, plus your preferences (gathered once, refined forever)."}},p={Starter:0,Pro:1,Business:2},h={Starter:10,Pro:30,Business:100},m={"Inbox Concierge":"Starter","Paperwork Agent":"Starter","Career Engine":"Starter","Life Logistics":"Starter","Invoice Chaser":"Starter","Brand Kit Lab":"Starter","Reputation Autopilot":"Pro","Social Autopilot":"Pro","Clip Factory":"Pro","Repurpose Engine":"Pro","Sponsor Kit":"Pro","Competitor Radar":"Business"},y=(e,t)=>p[t]>=p[m[e]],g=(e,t=8)=>{let n=(e||"").trim().split(/\s+/);return n.slice(0,t).join(" ")+(n.length>t?"…":"")},b={"Reputation Autopilot":{fields:[{key:"biz",label:"Your business name",type:"text",placeholder:"Bluebird Café"},{key:"stars",label:"Star rating of the review",type:"select",options:["1","2","3","4","5"]},{key:"review",label:"Paste the review",type:"textarea",placeholder:"Waited 40 minutes and the food was cold…"},{key:"tone",label:"Your response tone",type:"select",options:["Warm & personal","Polished & professional","Playful"]}],generate:e=>{let t=+e.stars,n=(e.review||"").toLowerCase(),r=/wait|slow|line|forever/.test(n)?"wait times":/rude|staff|service|attitude/.test(n)?"service":/dirty|clean|mess/.test(n)?"cleanliness":/price|expensive|charge|cost/.test(n)?"pricing":/cold|stale|quality|broken/.test(n)?"quality":"",a=t<=2?`Thank you for telling us straight \u{2014} this isn't the visit we want anyone to have at ${e.biz}, and I'm sorry we missed the mark.`:3===t?"Thanks for the honest, balanced review — we'll take the three stars, but we want the other two back.":"This made our morning — thank you for taking the time to say it.",l=r?`What you described${e.review?` ("${g(e.review)}")`:""} points at our ${r}, and it's already been raised with the team \u{2014} that's a fix, not a platitude.`:t<=3?"We've shared your note with the whole team so the next visit reads very differently.":"We've pinned this one up for the team — it's exactly what we're trying to do every day.",o="Playful"===e.tone?"Come back soon — the next one's on its best behavior. 🧡":"Warm & personal"===e.tone?"If you'll give us another chance, ask for me — I'd like to make this right personally.":"We'd welcome the chance to serve you again, and to a higher standard.",i=[{h:"Drafted response (awaiting your one-tap approval)",lines:[`${a} ${l} ${o}`,`\u{2014} ${e.biz}`]}];return r&&t<=3&&i.push({h:"⚠ Operations signal",lines:[`This is the kind of review we cluster: if 2 more mention ${r} this month, you'll get an ops alert with the pattern, dates, and suggested fix \u{2014} not just polite replies.`]}),i.push({h:"This week, on autopilot",lines:["• 4 platforms monitored hourly (Google, Yelp, Facebook, TripAdvisor)","• Every response drafted in this voice, posted only after your tap","• Month-end: rating trend + complaint heatmap report"]}),i}},"Invoice Chaser":{fields:[{key:"client",label:"Client name",type:"text",placeholder:"Meadow Co."},{key:"amount",label:"Amount owed",type:"text",placeholder:"$1,850"},{key:"days",label:"Days overdue",type:"select",options:["15","30","60","90+"]},{key:"rel",label:"Relationship",type:"select",options:["Long-time client","New client","Repeat late payer"]}],generate:e=>{let t="Repeat late payer"!==e.rel;return[{h:"Email 1 — the nudge (sends today)",lines:[`Subject: Quick one \u{2014} invoice for ${e.amount}`,t?`Hi ${e.client} team \u{2014} hope things are good on your end. The ${e.amount} invoice is showing ${e.days} days past due, which I'm guessing just slipped through. Payment link below \u{2014} takes about a minute. Thanks!`:`Hi ${e.client} team \u{2014} following up on the ${e.amount} invoice, now ${e.days} days past due. The payment link below settles it in about a minute. Appreciate you closing this out this week.`,`[ Pay ${e.amount} now \u{2192} ]`]},{h:"Email 2 — the reminder (auto-sends in 7 days if unpaid)",lines:[`Subject: Second notice \u{2014} ${e.amount} outstanding`,`Hi ${e.client} team \u{2014} circling back on the ${e.amount} invoice. We want to keep things easy on both sides, so if there's an issue with the invoice itself, reply here and we'll sort it. Otherwise, the link below closes it out today.`]},{h:"Email 3 — the firm one (auto-sends in 14 days if unpaid)",lines:[`Subject: Final notice before escalation \u{2014} ${e.amount}`,`Hi ${e.client} \u{2014} the ${e.amount} invoice remains unpaid after multiple notices. To avoid late fees and a pause on future work, payment is required by end of week. If payment has been sent, forward the confirmation and we'll reconcile immediately.`]},{h:"Escalation plan",lines:[t?`\u{2022} ${e.rel} \u{2014} the ladder stays courteous through Email 2; firmness arrives only at Email 3`:"• Repeat late payer — the ladder starts firmer and Email 3 recommends prepayment terms for future work","• Each email carries a one-click payment link and logs opens","• If Email 3 expires: you get an escalation card with options (late fee, collections letter, write-off) — your call, one tap"]}]}},"Social Autopilot":{fields:[{key:"biz",label:"Your business",type:"text",placeholder:"Kettle & Co. — handmade candles"},{key:"push",label:"What should this month push?",type:"text",placeholder:"The new autumn collection"},{key:"vibe",label:"Brand vibe",type:"select",options:["Cozy & warm","Bold & punchy","Clean & premium"]}],generate:e=>{let t=(e,t)=>`${e} \u{2014} "${t}"`,n="Bold & punchy"===e.vibe?"Loud":"Clean & premium"===e.vibe?"Quiet luxury":"Warm";return[{h:"Week 1 of your 30-day calendar (sample)",lines:[t("MON · Reel",`POV: ${e.push} just dropped and your whole feed can smell it. (hook: 0.8s product macro)`),t("TUE · Story poll",`Two of ${e.push} head-to-head \u{2014} 'which one lives on your shelf?' (engagement bait, zero production)`),t("WED · Carousel",`The making of ${e.push}: 5 slides, hands + process + one imperfection kept in. People buy the maker.`),t("FRI · Static",`${n} flat-lay of ${e.push} with one line of copy and nothing else. Let it breathe.`),t("SUN · UGC repost","Customer photo + your one-line reply. Cheapest trust you'll ever buy.")]},{h:"Strategy note (why this mix)",lines:[`\u{2022} ${e.push} carries the month, but only 40% of posts sell \u{2014} the rest build the habit of watching ${e.biz}`,"• Reels for reach, carousels for saves, stories for votes — each format has one job","• Every tile is rendered in your locked brand kit before you see it; you approve the month in one sitting"]},{h:"What the full run delivers",lines:["• 30 designed posts, captioned + hashtagged","• Scheduled across Instagram & Facebook after your approval","• Next month's calendar auto-learns from this month's numbers"]}]}},"Competitor Radar":{fields:[{key:"biz",label:"Your business",type:"text",placeholder:"Bluebird Café, Portland"},{key:"comp",label:"Competitors to watch (comma-separated)",type:"text",placeholder:"Stumptown Corner, The Daily Perk"},{key:"worry",label:"What keeps you up at night?",type:"select",options:["Their pricing","Their reviews are better","Their new offers","Their ads are everywhere"]}],generate:e=>{let t=(e.comp||"your competitors").split(",").map(e=>e.trim()).filter(Boolean),n=t[0]||"Competitor A",r=t[1]||t[0]||"Competitor B";return[{h:"Monday brief — sample edition",lines:[`\u{1F534} SIGNAL \u{2014} ${n} changed pricing on 3 core items this week (avg \u{2212}8%). Their reviews mention 'value' 2\xd7 more than last month. This is a positioning move, not a sale.`,`\u{1F7E1} WATCH \u{2014} ${r} started running Meta ads Tuesday (4 creatives, all video, all targeting your zip). Small budget so far \u{2014} a test, not a push. We'll flag if spend jumps.`,`\u{1F7E2} NOISE \u{2014} ${n} redesigned their logo. Customers don't care; neither should you.`,`\u{1F4C9} THEIR WEAK SPOT \u{2014} ${r}'s last 11 reviews: 5 mention slow service at peak hours. That's your opening, not theirs.`]},{h:"The counter-move (one, not forty)",lines:["Their pricing"===e.worry?`Don't match ${n}'s cut \u{2014} you lose a price war against nothing. Instead: bundle. A bundle at your current margin reads as generosity without repricing anything, and it's invisible to their comparison.`:"Their reviews are better"===e.worry?"Their review lead is volume, not quality. Turn on review-ask automation for your happiest moments (post-purchase, post-compliment). 15 fresh reviews beats their stale 200 in local ranking recency.":"Their new offers"===e.worry?"Their offer is broad; go narrow. One sharply-specific offer for your best segment beats their something-for-everyone — and their unhappy 'slow at peak' reviewers are exactly who to aim it at.":`Their ads buy attention; your speed can steal the conversion. Peak-hour promise ("in and out in 10") aimed at ${r}'s slow-service complainers turns their ad spend into your foot traffic.`]},{h:"Every week, on autopilot",lines:[`\u{2022} ${t.length||2} competitors watched: sites, socials, reviews, ad libraries \u{2014} diffed weekly`,"• Ranked signal/watch/noise so you read one page, not forty","• One recommended move per week. Ignore freely — it keeps coming."]}]}},"Clip Factory":{fields:[{key:"topic",label:"What's the video about?",type:"textarea",placeholder:"Episode 42: I interviewed a burnout coach about why high performers crash…"},{key:"len",label:"Video length",type:"select",options:["Under 20 min","20–60 min","60+ min"]},{key:"aud",label:"Who watches you?",type:"text",placeholder:"Ambitious 25-40yo professionals"}],generate:e=>{let t=g(e.topic||"your topic",6),n="60+ min"===e.len?"10–12":"20–60 min"===e.len?"7–9":"4–6";return[{h:`Clip sheet (${n} clips from this upload \u{2014} top 5 shown)`,lines:[`01 \xb7 [12:40] "The thing nobody tells you about ${t}" \u{2014} opens mid-sentence on the boldest claim. Retention score 87 \xb7 post FIRST`,"02 · [31:05] The story moment — personal, specific, slightly uncomfortable. Score 82 · post 3rd, stories reward mid-week",`03 \xb7 [04:18] The contrarian take your ${e.aud||"audience"} will argue about in comments. Score 79 \xb7 comments = distribution`,"04 · [47:52] The practical bit — '3 things to do tonight.' Saves magnet. Score 74","05 · [22:11] The laugh — 28 seconds, no context needed. Score 71 · palate cleanser between heavy posts"]},{h:"Every clip arrives dressed",lines:["• Animated captions in your style (word-by-word, keyword-highlighted)","• Vertical reframe with faces auto-centered","• A thumbnail per clip, in your locked brand kit","• Hook rewritten as the first line of the caption"]},{h:"Posting order logic",lines:["• Highest score ≠ always first — the sheet sequences for momentum: bold claim → argument-starter → story → utility","• Scores are predictions, not promises: the next upload's scores learn from this one's real numbers"]}]}},"Repurpose Engine":{fields:[{key:"idea",label:"Paste the core idea / key passage",type:"textarea",placeholder:"Most productivity advice fails because it's designed for people with no obligations…"},{key:"voice",label:"Voice",type:"select",options:["Punchy","Thoughtful","Contrarian"]}],generate:e=>{let t=g(e.idea||"your idea",12),n="Punchy"===e.voice?"short. sharp. no wasted words.":"Contrarian"===e.voice?"against the grain, receipts attached.":"measured, generous, sure of itself.";return[{h:"X thread (5 of 8 tweets)",lines:[`1/ ${t} \u{2014} and almost everyone gets this backwards. \u{1F9F5}`,"2/ The common advice assumes a life you don't have. That's not a small flaw. It's the whole problem.","3/ Here's what actually happens when real constraints meet ideal systems: (story beat pulled from your source)","4/ The fix isn't more discipline. It's a system that expects you to fail on Tuesdays.","5/ Steal this: (the single most practical line from your source, quoted verbatim)"]},{h:"Newsletter opener",lines:[`I want to tell you about the moment I stopped believing ${t.toLowerCase().replace(/\.$/,"")} \u{2014} because the way it fell apart says more than the idea ever did. (continues 600\u{2013}800 words, in your voice: ${n})`]},{h:"LinkedIn post",lines:[`Unpopular opinion from someone who's tested it: ${t}`,"Three observations from the field → one uncomfortable conclusion → a question that makes commenters do your distribution for you."]},{h:"Blog outline (SEO-shaped)",lines:["• H1: the claim, phrased how people search it","• H2: Why the standard advice fails (your story)","• H2: What works instead (the framework, named)","• H2: How to start this week (3 steps)","• FAQ block targeting the long-tail questions"]},{h:"Voice gate",lines:[`Every piece above is QA'd against your trained voice profile (${e.voice.toLowerCase()}) \u{2014} vocabulary, rhythm, opinions. If it doesn't sound like you, it doesn't ship.`]}]}},"Brand Kit Lab":{fields:[{key:"name",label:"Channel / brand name",type:"text",placeholder:"The Honest Kitchen"},{key:"colors",label:"Your colors",type:"text",placeholder:"Forest green, cream, a hit of orange"},{key:"words",label:"Three words for your style",type:"text",placeholder:"Warm, handmade, confident"},{key:"asset",label:"What do you need?",type:"select",options:["Thumbnail","Banner","Post template"]}],generate:e=>[{h:`Three ${(e.asset||"asset").toLowerCase()} directions (renders attached in a real run)`,lines:[`A \xb7 "The Stare" \u{2014} tight face crop left third, ${e.colors||"your palette"} split background, 3-word overlay max in your display type. Highest CTR pattern for ${e.words||"your"} energy; the eyes do the clicking.`,`B \xb7 "The Object" \u{2014} the subject isolated dead-center on cream, one accent bar. ${e.words?e.words.split(",")[0]:"Clean"} to the point of confidence. Reads at 120px; most thumbnails don't.`,"C · \"The Tease\" — before/after diagonal split, arrow drawn slightly wrong on purpose (handmade > polished for your brand). Curiosity-gap overlay: 2 words + '…'"]},{h:"Why these will look like YOU",lines:[`\u{2022} All three obey ${e.name||"your"} locked identity file: palette (${e.colors||"captured at setup"}), type, logo rules, face treatment`,"• Contrast + legibility tested at thumbnail size before you ever see them","• 'Make my face bigger and the text angrier' is a valid revision. Unlimited, inside the task."]},{h:"You own everything",lines:["• Source files delivered with every asset","• The identity file is exportable — no hostage branding"]}]},"Sponsor Kit":{fields:[{key:"niche",label:"Your niche",type:"text",placeholder:"Home cooking for busy parents"},{key:"size",label:"Audience size",type:"select",options:["Under 10k","10k–100k","100k–1M","1M+"]},{key:"platform",label:"Main platform",type:"select",options:["YouTube","Instagram","TikTok","Newsletter"]}],generate:e=>[{h:"Your media kit, always current",lines:[`\u{2022} Live ${e.platform} stats pulled monthly \u{2014} never send stale numbers again`,`\u{2022} Audience story: who they are, what they buy, why they trust you on ${e.niche||"your niche"}`,"• Designed in your brand kit; versioned so you can see your own growth"]},{h:"This month's matched sponsors (sample archetypes)",lines:[`\u{2460} The category-native: a ${e.niche?e.niche.toLowerCase():"niche"} brand already sponsoring creators in the ${e.size} band \u{2014} warm, obvious, fastest yes.`,"② The adjacent mover: a brand one category over whose customers are your audience (found via their actual campaign activity, not guesswork).","③ The upstart with budget: recently funded, buying its first creator placements, pays above market for exactly your credibility."]},{h:"Outreach draft (personalized per brand in a real run)",lines:[`Subject: Your [campaign name] campaign + my ${e.platform} audience`,`Hi [name] \u{2014} I watched your recent creator campaign and there's a gap in it my audience fills: [specific overlap]. My ${e.size} ${e.platform} audience of ${e.niche?e.niche.toLowerCase()+" loyalists":"loyalists"} converts on exactly this. Media kit attached \u{2014} the rates on p.3 hold through [date].`,"— No 'Dear Partnerships Team.' Ever."]}]},"Inbox Concierge":{fields:[{key:"name",label:"Your name",type:"text",placeholder:"Jaden"},{key:"flavor",label:"What's your inbox like?",type:"select",options:["Client-heavy","Newsletter avalanche","Internal chaos","All of it"]},{key:"style",label:"Reply style",type:"select",options:["Brief & direct","Warm & chatty"]}],generate:e=>[{h:`Tomorrow, 6:45 AM \u{2014} ${e.name||"your"} digest`,lines:["NEEDS YOU (3):","① Client X asked for a scope change — I drafted a yes-with-boundaries reply, needs your judgment on the price line.","② Invo <style>
#chl-flash{position:fixed;inset:0;z-index:-1;background:#F1ECE2;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.5rem;pointer-events:none}
#chl-flash p{white-space:nowrap;font-weight:900;font-size:4.5rem;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:#141414;opacity:0;transform:rotate(-6deg)}
#chl-flash p:nth-child(2){transform:rotate(-6deg) translate(-60px)}
#chl-flash p:nth-child(3){transform:rotate(-6deg) translate(-120px)}
</style>
<div id="chl-flash" aria-hidden="true"><p></p><p></p><p></p></div>
<script>
(function () {
  var strips = document.querySelectorAll("#chl-flash p");
  for (var i = 0; i < strips.length; i++) strips[i].textContent = new Array(13).join("CHORELESS ✦ ");
  var EASE = "cubic-bezier(.22,1,.36,1)";
  var last = { x: 0, y: 0, t: -1 };
  window.addEventListener("pointerdown", function (e) {
    last = { x: e.clientX, y: e.clientY, t: performance.now() };
  }, true);
  function ring(x, y) {
    var el = document.createElement("div");
    el.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid rgba(255,77,0,.5);border-radius:50%;pointer-events:none;z-index:9999;";
    document.body.appendChild(el);
    el.animate([{ transform: "scale(.6)", opacity: 0.55 }, { transform: "scale(3.4)", opacity: 0 }], { duration: 420, easing: EASE, fill: "forwards" });
    setTimeout(function () { el.remove(); }, 460);
  }
  function play() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var root = document.getElementById("root");
    var shell = root && root.firstElementChild;
    if (!shell) return;
    var fresh = performance.now() - last.t < 600;
    var x = fresh ? last.x : window.innerWidth / 2;
    var y = fresh ? last.y : window.innerHeight / 2;
    window.scrollTo(0, 0);
    var rect = shell.getBoundingClientRect();
    var r = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y)) + 24;
    shell.animate(
      [{ clipPath: "circle(0px at " + (x - rect.left) + "px " + (y - rect.top) + "px)" },
       { clipPath: "circle(" + r + "px at " + (x - rect.left) + "px " + (y - rect.top) + "px)" }],
      { duration: 420, easing: EASE });
    ring(x, y);
  }
  function watch() {
    var root = document.getElementById("root");
    var shell = root && root.firstElementChild;
    if (!shell) { requestAnimationFrame(watch); return; }
    new MutationObserver(function (muts) {
      var added = false, removed = false;
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].addedNodes.length) added = true;
        if (muts[i].removedNodes.length) removed = true;
      }
      if (added && removed) play();
    }).observe(shell, { childList: true });
  }
  watch();
})();
</script>
